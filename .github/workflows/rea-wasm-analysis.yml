name: WASM binary inspection (WABT verified)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local WebAssembly disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          node --version
      - name: Confirm verified WASM fixture exists
        run: |
          test -s dev/recomp-port/safari/fixture.wasm
          mkdir -p rea-report
          sha256sum dev/recomp-port/safari/fixture.wasm | tee rea-report/sha256.txt
      - name: Baseline native WABT validation and inspection
        run: |
          wasm-validate dev/recomp-port/safari/fixture.wasm
          wasm-objdump -x dev/recomp-port/safari/fixture.wasm > rea-report/wasm-sections.txt
          wasm2wat dev/recomp-port/safari/fixture.wasm -o rea-report/fixture.wat
          node - <<'NODE' > rea-report/browser-interface.json
          const fs=require('fs');
          const b=fs.readFileSync('dev/recomp-port/safari/fixture.wasm');
          const m=new WebAssembly.Module(b);
          const i=new WebAssembly.Instance(m,{});
          const result=i.exports.run_fixture();
          const data={valid:WebAssembly.validate(b),bytes:b.length,imports:WebAssembly.Module.imports(m),exports:WebAssembly.Module.exports(m),result};
          console.log(JSON.stringify(data,null,2));
          if(result!==42)process.exit(1);
          NODE
      - name: Upload read-only analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-structure-analysis
          path: rea-report/
          if-no-files-found: warn
